# TLS terminates at the loopback VLESS compatibility listener on 8443.
# Separate cleartext HTTP/1 and h2c fallbacks preserve both ALPN modes.
server {
    listen 80;
    server_name tls245.torcalc.ru;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://tls245.torcalc.ru$request_uri; }
}
server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8081 http2;
    server_name tls245.torcalc.ru;
    root /var/www/tls245.torcalc.ru;
    index index.html;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
