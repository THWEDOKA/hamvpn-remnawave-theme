# Decrypted HTTP fallback from VLESS TLS; not public listeners.
server {
    listen 127.0.0.1:9443;
    listen 127.0.0.1:9444 http2;
    server_name nl82.torcalc.ru;
    root /var/www/nl82.torcalc.ru;
    index index.html;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\\. { deny all; }
}
