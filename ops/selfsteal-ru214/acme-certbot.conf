# Applies only to certificate maintenance, never to VPN or system-wide traffic.
[Unit]
Wants=hamvpn-acme-ru214.service
After=hamvpn-acme-ru214.service

[Service]
ExecStartPre=/usr/bin/python3 /usr/local/lib/hamvpn-acme-ru214/acme-ready.py
Environment="HTTPS_PROXY=socks5h://127.0.0.1:18089"
Environment="https_proxy=socks5h://127.0.0.1:18089"
