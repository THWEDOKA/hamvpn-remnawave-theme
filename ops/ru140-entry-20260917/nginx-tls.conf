server {
    listen 80;
    server_name in-de3.torcalc.ru in-pl2.torcalc.ru in-nl.torcalc.ru in-de4.torcalc.ru;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

# Public VPN port belongs to REALITY. Verify reachability from Xray's namespace.
server {
    listen 127.0.0.1:8443 ssl http2;
    server_name in-de3.torcalc.ru in-pl2.torcalc.ru in-nl.torcalc.ru in-de4.torcalc.ru;
    root /var/www/in-de3.torcalc.ru;
    index index.html;
    server_tokens off;
    charset utf-8;
    ssl_certificate /etc/letsencrypt/live/in-de3.torcalc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/in-de3.torcalc.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SS35a65b76a03d:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
