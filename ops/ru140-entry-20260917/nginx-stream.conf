stream {
    map $ssl_preread_server_name $ham_ru140_backend {
        default 127.0.0.1:8443;
        in-de3.torcalc.ru 127.0.0.1:11443;
        in-pl2.torcalc.ru 127.0.0.1:12443;
        in-nl.torcalc.ru 127.0.0.1:13443;
        in-de4.torcalc.ru 127.0.0.1:14443;
    }
    server {
        listen 443;
        ssl_preread on;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_pass $ham_ru140_backend;
    }
}
